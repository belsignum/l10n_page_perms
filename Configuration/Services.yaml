services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Belsignum\L10nPagePerms\:
    resource: '../Classes/*'

  # DataHandler creates hook objects with GeneralUtility::makeInstance(), which needs a public service.
  Belsignum\L10nPagePerms\Hook\DataHandlerHook:
    public: true

  Belsignum\L10nPagePerms\Command\RepairCommand:
    public: true
    tags:
      - name: console.command
        command: 'l10n-page-perms:repair'
        description: 'Gives page translations the access rights and l10n_mode=exclude fields of their default language page.'
        schedulable: false
